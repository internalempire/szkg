name: Update Vibe Coded Badge

on:
  push:
    branches: [main]

# This workflow is the only automation allowed to change repository contents.
# The regular CI workflow remains read-only.
permissions:
  contents: write

jobs:
  update-badge:
    # The action's own commit contains this marker, preventing an update loop.
    if: "!contains(github.event.head_commit.message, '[skip vibe-badge]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Pinned to a reviewed commit instead of the mutable @main reference.
      - name: Analyze AI attribution and update the README badge
        uses: ai-ecoverse/vibe-coded-badge-action@c6875e7a00b5fa208aef24a2e083ccbe13fa870d
