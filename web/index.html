<!doctype html>
<!-- Static application shell. JavaScript supplies graph data and interactions. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SZKG — Semantic Zotero Knowledge Graph</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1 class="brand">
        <img class="logo-mark" src="../assets/logo.png" alt="SZKG logo" />
        <span class="brand-text">
          <span class="brand-name">SZKG</span>
          <span class="brand-sub">Semantic Zotero Knowledge Graph</span>
        </span>
      </h1>
      <p id="stats" class="muted">Loading...</p>
      <input id="search" type="search" placeholder="Search paper titles..." autocomplete="off" />
      <div class="controls">
        <label class="switch">
          <input type="checkbox" id="toggle-weak" checked />
          Show weak assignments
        </label>
        <button id="btn-refresh" title="Reload and reconcile the complete map data">Refresh data</button>
        <button id="btn-reset" title="Return to the complete view">Reset view</button>
      </div>
      <h2>Topics</h2>
      <ul id="legend"></ul>
    </aside>

    <main id="canvas-wrap">
      <div id="cy"></div>
      <div id="topic-labels"></div>
      <div id="loading">Loading the semantic map...</div>
      <div id="zoom-controls">
        <button id="btn-zoom-in" title="Zoom in">+</button>
        <button id="btn-zoom-out" title="Zoom out">-</button>
        <button id="btn-zoom-fit" title="Fit the complete map">&#10530;</button>
      </div>
      <div id="panels">
        <div id="info2" class="info-panel hidden">
          <button class="panel-close" data-box="info2" aria-label="Close">&times;</button>
          <div class="panel-body"></div>
        </div>
        <div id="info" class="info-panel hidden">
          <button class="panel-close" data-box="info" aria-label="Close">&times;</button>
          <div class="panel-body"></div>
        </div>
      </div>
      <div id="tooltip" class="hidden"></div>
    </main>
  </div>
  <script src="loader.js"></script>
</body>
</html>
